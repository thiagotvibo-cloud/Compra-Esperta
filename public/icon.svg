<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1A73E8"/>
            <stop offset="100%" stop-color="#0742A0"/>
        </linearGradient>
        
        <!-- Cart Body Gradient -->
        <linearGradient id="cartBody" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#E8EAED"/>
        </linearGradient>

        <!-- Accent Gradient -->
        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8AB4F8"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>

        <!-- Drop Shadows -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
        <filter id="innerGlow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
            <feFlood flood-color="#FFFFFF" flood-opacity="0.5" result="glowColor"/>
            <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
            <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- App Icon Background -->
    <rect width="512" height="512" rx="115" fill="url(#bg)"/>
    
    <!-- Decorative background elements -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="40"/>
    <circle cx="256" cy="256" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="20"/>

    <g transform="translate(60, 110)" filter="url(#shadow)">
        <!-- Handle -->
        <path d="M 40 40 L 90 40 C 105 40 115 50 120 65 L 145 135" fill="none" stroke="url(#cartBody)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Main Basket -->
        <path d="M 120 65 L 340 65 C 360 65 375 80 370 100 L 335 220 C 330 235 315 245 300 245 L 175 245 C 155 245 140 230 135 210 L 105 100" fill="url(#cartBody)" stroke="url(#cartBody)" stroke-width="15" stroke-linejoin="round"/>
        
        <!-- Basket Grid Lines -->
        <path d="M 155 125 L 345 125 M 165 185 L 320 185" fill="none" stroke="#D2E3FC" stroke-width="12" stroke-linecap="round"/>
        <path d="M 205 65 L 205 245 M 275 65 L 255 245" fill="none" stroke="#D2E3FC" stroke-width="12" stroke-linecap="round"/>
        
        <!-- Top Rim Accent -->
        <path d="M 120 65 L 340 65" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round" filter="url(#innerGlow)"/>

        <!-- Wheels -->
        <circle cx="185" cy="310" r="32" fill="#1A73E8" stroke="#FFFFFF" stroke-width="12"/>
        <circle cx="185" cy="310" r="12" fill="#FFFFFF"/>
        
        <circle cx="305" cy="310" r="32" fill="#1A73E8" stroke="#FFFFFF" stroke-width="12"/>
        <circle cx="305" cy="310" r="12" fill="#FFFFFF"/>
        
        <!-- Speed lines / Motion effect -->
        <path d="M -10 160 L 50 160 M 10 210 L 70 210" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="12" stroke-linecap="round"/>
    </g>
</svg>
