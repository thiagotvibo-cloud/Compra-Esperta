<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4285F4" />
            <stop offset="100%" stop-color="#0b57d0" />
        </linearGradient>
        <linearGradient id="cartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#e3f2fd" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.25" />
        </filter>
        <filter id="wheelShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.2" />
        </filter>
    </defs>
    
    <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
    
    <g transform="translate(85, 110) scale(1.3)" filter="url(#shadow)">
        <path d="M20 20 L65 20 L110 145 L225 145 L255 55 L75 55" fill="none" stroke="url(#cartGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M120 85 L235 85" fill="none" stroke="url(#cartGrad)" stroke-width="16" stroke-linecap="round" />
        <path d="M130 115 L220 115" fill="none" stroke="url(#cartGrad)" stroke-width="16" stroke-linecap="round" />
        <path d="M150 55 L150 145" fill="none" stroke="url(#cartGrad)" stroke-width="16" stroke-linecap="round" />
        <path d="M190 55 L190 145" fill="none" stroke="url(#cartGrad)" stroke-width="16" stroke-linecap="round" />
        <path d="M35 20 L65 20" fill="none" stroke="#93c5fd" stroke-width="22" stroke-linecap="round" />
    </g>
    <g transform="translate(85, 110) scale(1.3)">
        <circle cx="95" cy="190" r="22" fill="#ffffff" filter="url(#wheelShadow)"/>
        <circle cx="95" cy="190" r="10" fill="#0b57d0" />
        <circle cx="205" cy="190" r="22" fill="#ffffff" filter="url(#wheelShadow)"/>
        <circle cx="205" cy="190" r="10" fill="#0b57d0" />
