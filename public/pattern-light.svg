<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none" stroke="#064e3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.12">
  <!-- Carrot -->
  <g transform="translate(50, 50) rotate(45) scale(0.8)">
    <path d="M 0 0 L 20 -40 L 40 0 C 40 40 30 80 20 100 C 10 80 0 40 0 0 Z" />
    <path d="M 10 -40 C 5 -60 -10 -70 -20 -60" />
    <path d="M 20 -40 C 20 -70 10 -80 0 -90" />
    <path d="M 30 -40 C 35 -60 50 -70 60 -60" />
    <line x1="5" y1="20" x2="15" y2="20" />
    <line x1="25" y1="40" x2="35" y2="40" />
    <line x1="5" y1="60" x2="15" y2="60" />
  </g>

  <!-- Tomato -->
  <g transform="translate(250, 60) scale(0.9)">
    <circle cx="0" cy="0" r="40" />
    <path d="M -10 -40 Q 0 -20 10 -40" />
    <path d="M 0 -35 Q 0 -50 15 -60" />
    <path d="M 0 -35 Q -20 -45 -30 -30" />
    <path d="M 0 -35 Q 20 -45 30 -30" />
  </g>

  <!-- Broccoli -->
  <g transform="translate(320, 200) scale(0.8)">
    <path d="M -10 40 L -20 80 L 20 80 L 10 40 Z" />
    <path d="M -40 20 C -60 0 -30 -30 -10 -20 C -10 -50 30 -50 30 -20 C 50 -30 80 0 60 20 C 80 50 40 70 20 50 C 0 70 -40 50 -20 50 C -40 70 -60 40 -40 20 Z" />
  </g>

  <!-- Eggplant -->
  <g transform="translate(100, 250) rotate(-30) scale(0.8)">
    <path d="M 0 0 C 30 -20 60 10 50 50 C 40 100 -20 120 -40 80 C -60 40 -30 20 0 0 Z" />
    <path d="M -10 -10 L 0 -30 L 10 -10 Z" />
    <path d="M 0 -30 Q 10 -50 30 -40" />
  </g>

  <!-- Mushroom -->
  <g transform="translate(200, 320) scale(0.7)">
    <path d="M -20 20 L -20 60 C -20 70 20 70 20 60 L 20 20" />
    <path d="M -50 20 C -50 -30 50 -30 50 20 Z" />
    <circle cx="-20" cy="0" r="5" />
    <circle cx="10" cy="-5" r="8" />
    <circle cx="25" cy="10" r="4" />
  </g>

  <!-- Pepper/Capsicum -->
  <g transform="translate(180, 150) scale(0.8)">
    <path d="M -30 0 C -50 0 -50 50 -30 80 C -10 110 10 110 30 80 C 50 50 50 0 30 0 C 10 0 10 20 0 20 C -10 20 -10 0 -30 0 Z" />
    <path d="M -10 20 C -20 50 -20 80 0 100" />
    <path d="M 10 20 C 20 50 20 80 0 100" />
    <path d="M -5 10 L 0 -20 L 10 -15" />
  </g>

  <!-- Garlic -->
  <g transform="translate(30, 150) scale(0.6)">
    <path d="M 0 -40 C -20 0 -50 20 -40 60 C -30 100 30 100 40 60 C 50 20 20 0 0 -40 Z" />
    <path d="M 0 -40 C -10 20 -20 50 0 90" />
    <path d="M 0 -40 C 10 20 20 50 0 90" />
    <path d="M -20 85 L -30 100" />
    <path d="M 0 90 L 0 110" />
    <path d="M 20 85 L 30 100" />
  </g>

  <!-- Peas in a pod -->
  <g transform="translate(300, 320) rotate(-45) scale(0.7)">
    <path d="M -60 0 C -30 -30 30 -30 60 0 C 30 30 -30 30 -60 0 Z" />
    <circle cx="-30" cy="0" r="10" />
    <circle cx="0" cy="0" r="10" />
    <circle cx="30" cy="0" r="10" />
    <path d="M -60 0 C -40 -10 -20 -10 0 0 C 20 10 40 10 60 0" />
  </g>

  <!-- Leaf 1 -->
  <g transform="translate(100, 30) rotate(15) scale(0.5)">
    <path d="M 0 0 C 40 -40 80 0 40 40 C 0 80 -40 40 0 0 Z" />
    <path d="M -20 20 L 60 -20" />
  </g>

  <!-- Leaf 2 -->
  <g transform="translate(350, 100) rotate(-60) scale(0.4)">
    <path d="M 0 0 C 40 -40 80 0 40 40 C 0 80 -40 40 0 0 Z" />
    <path d="M -20 20 L 60 -20" />
  </g>

  <!-- Little dots for texture -->
  <circle cx="200" cy="50" r="2" fill="#064e3b" stroke="none" />
  <circle cx="80" cy="200" r="2" fill="#064e3b" stroke="none" />
  <circle cx="250" cy="220" r="3" fill="#064e3b" stroke="none" />
  <circle cx="150" cy="280" r="2" fill="#064e3b" stroke="none" />
  <circle cx="350" cy="30" r="2.5" fill="#064e3b" stroke="none" />
  <circle cx="30" cy="350" r="3" fill="#064e3b" stroke="none" />
</svg>